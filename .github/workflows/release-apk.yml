name: Build & Release Android APK

on:
  push:
    tags:
      - "v*" # Dispara quando você envia tags como v1.0.0, v1.0.1, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Angular App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore Keystore & Configuration
        run: |
          # Reconstrói a keystore física a partir do Secret Base64
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

          # Cria o keystore.properties consumido pelo build.gradle
          cat << EOF > android/keystore.properties
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease

      - name: Prepare APK for Release
        id: prepare_apk
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          APK_NAME="radiancia-ks-${TAG_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "./${APK_NAME}"
          echo "apk_path=frontend/${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          name: Radiância KS ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
