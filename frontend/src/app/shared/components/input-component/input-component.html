<div [class]="'input-wrapper ' + variant + ' radius-' + radius">
  @if (icon) {
    @if (isLucideIcon(icon)) {
      <lucide-icon [img]="icon" [class]="'icon ' + variant" />
    } @else {
      <span [class]="'icon ' + variant">{{ icon }}</span>
    }
  }
  <input
    [class]="variant"
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    (input)="onInput($event)"
  />
</div>
