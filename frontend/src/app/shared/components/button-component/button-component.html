<button
  [type]="type"
  [disabled]="disabled || isLoading"
  [class]="'btn ' + variant + ' size-' + size + ' radius-' + radius"
>
  @if (isLoading) {
    <div class="loadingspinner">
      <div id="square1"></div>
      <div id="square2"></div>
      <div id="square3"></div>
      <div id="square4"></div>
      <div id="square5"></div>
    </div>
  } @else {
    <ng-content></ng-content>
  }
</button>
