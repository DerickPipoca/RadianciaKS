<div class="modal-backdrop" (click)="!isProcessing && close.emit()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h2>Finalizar Venda</h2>
      <button class="close-btn" [disabled]="isProcessing" (click)="close.emit()">✕</button>
    </header>
    <main class="modal-body">
      <div class="total-sumary">
        <span class="label">Total a Pagar</span>
        <span class="value">R$ {{ total.toFixed(2) }}</span>
      </div>
      <div class="form-group">
        <label for="tableNumber">Mesa ou Nome do Cliente (Opicional)</label>
        <input
          type="text"
          id="tableNumber"
          [(ngModel)]="tableNumber"
          placeholder="Ex: Mesa 04 ou João"
          [disabled]="isProcessing"
        />
      </div>
      <div class="form-group">
        <label>Forma de Pagamento</label>
        <div class="payment-methods">
          <button
            class="payment-btn"
            [class.selected]="selectedMethod === PaymentMethod.Pix"
            (click)="selectMethod(PaymentMethod.Pix)"
          >
            PIX
          </button>
          <button
            class="payment-btn"
            [class.selected]="selectedMethod === PaymentMethod.CreditCard"
            (click)="selectMethod(PaymentMethod.CreditCard)"
          >
            Crédito
          </button>
          <button
            class="payment-btn"
            [class.selected]="selectedMethod === PaymentMethod.DebitCard"
            (click)="selectMethod(PaymentMethod.DebitCard)"
          >
            Débito
          </button>
          <button
            class="payment-btn"
            [class.selected]="selectedMethod === PaymentMethod.Cash"
            (click)="selectMethod(PaymentMethod.Cash)"
          >
            Dinheiro
          </button>
          <button
            class="payment-btn"
            [class.selected]="selectedMethod === PaymentMethod.Other"
            (click)="selectMethod(PaymentMethod.Other)"
          >
            Outro
          </button>
        </div>
      </div>
      @if (selectedMethod === PaymentMethod.Cash) {
        <div class="cash-group">
          <div class="form-group">
            <label for="amountReceived">Valor Recebido (R$)</label>
            <input
              type="number"
              id="amountReceived"
              [(ngModel)]="amountReceived"
              min="0"
              step="0.01"
              [disabled]="isProcessing"
            />
          </div>
          <div class="change-summary" [class.negative]="amountReceived < total">
            <span class="label">Troco:</span>
            <span class="value">R$ {{ changeAmount.toFixed(2) }}</span>
          </div>
        </div>
      }
    </main>
    <footer class="modal-footer">
      <button class="cancel-btn" [disabled]="isProcessing" (click)="close.emit()">Voltar</button>
      <button class="confirm-btn" [disabled]="!isFormValid || isProcessing" (click)="confirm()">
        @if (isProcessing) {
          A processar...
        } @else {
          Confirmar Venda
        }
      </button>
    </footer>
  </div>
</div>
