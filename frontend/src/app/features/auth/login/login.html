<div class="login-container">
  <div class="login-card">
    <div class="login-form-side">
      <h1 class="welcome-message">Bem-vindos de volta 👋</h1>

      @if (errorMessage()) {
        <div class="error-alert">{{ errorMessage() }}</div>
      }

      <form (ngSubmit)="onLogin()">
        <app-input-component
          class="input"
          icon="C"
          placeholder="CPF"
          [(value)]="credentials.cpf"
          name="cpf"
        ></app-input-component>
        <app-input-component
          class="input"
          icon="S"
          type="password"
          placeholder="*****"
          [(value)]="credentials.password"
          name="password"
        ></app-input-component>

        <app-button-component
          size="lg"
          variant="primary"
          radius="round"
          [isLoading]="isLoading()"
          type="submit"
        >
          {{ isLoading() ? 'A autenticar...' : 'Logar' }}
        </app-button-component>
      </form>
    </div>

    <div class="brand-side">
      <img src="login-image.png" alt="Logo Radiância" />
    </div>
  </div>
</div>
