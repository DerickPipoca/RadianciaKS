<div class="cash-shift-widget" [class.is-open]="hasOpenShift" (click)="promptAction()">
  <div class="indicator-dot"></div>
  <div class="indicator-text">
    <span class="title">Status do Caixa</span>
    @if (hasOpenShift) {
      <span class="status-open">Aberto</span>
    } @else {
      <span class="status-closed">Fechado</span>
    }
  </div>
</div>

@if (showOpenModal) {
  <app-modal-component title="Abertura de Caixa" (onClose)="showOpenModal = false">
    <div class="modal-body">
      <div class="form-row" style="margin-bottom: 20px">
        <div class="form-group flex-1">
          <label>Troco Inicial</label>
          <app-input-component
            type="number"
            [formatDecimal]="true"
            [(value)]="initialBalance"
            placeholder="Ex: 150.75"
          ></app-input-component>
          <small style="color: var(--text-secondary); margin-top: 4px">
            Valor disponível em gaveta antes de iniciar as vendas.
          </small>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <app-button-component variant="secondary" size="md" (click)="showOpenModal = false">
        Cancelar
      </app-button-component>
      <app-button-component variant="primary" size="md" (click)="openShift()">
        Confirmar Abertura
      </app-button-component>
    </div>
  </app-modal-component>
}

@if (showCloseModal) {
  <app-modal-component title="Fechamento de Caixa" (onClose)="showCloseModal = false">
    <div class="modal-body">
      <div
        class="summary-box"
        style="
          margin-bottom: 20px;
          background: rgba(0, 123, 255, 0.1);
          padding: 12px;
          border-radius: 8px;
        "
      >
        <div style="display: flex; justify-content: space-between; align-items: center">
          <label style="color: var(--text-primary); font-weight: 600">Status Atual</label>
          <strong class="badge-status" style="color: #4caf50"> Aberto </strong>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label>Valor físico em Gaveta</label>
          <app-input-component
            type="number"
            [formatDecimal]="true"
            [(value)]="finalReportedBalance"
            placeholder="Ex: 514.35"
          ></app-input-component>
          <small style="color: var(--text-secondary); margin-top: 4px">
            Faça a contagem de cédulas e moedas antes de encerrar.
          </small>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <app-button-component variant="secondary" size="md" (click)="showCloseModal = false">
        Cancelar
      </app-button-component>
      <app-button-component variant="danger" size="md" (click)="closeShift()">
        Encerrar Turno
      </app-button-component>
    </div>
  </app-modal-component>
}
