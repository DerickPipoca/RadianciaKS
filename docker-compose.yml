version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: radiancia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: radianciaKS
      POSTGRES_PASSWORD: radiancia!2026!radiancia
      POSTGRES_DB: RadianciaDb
    ports:
      - "5432:5432"
    volumes:
      - radiancia_data:/var/lib/postgresql/data

volumes:
  radiancia_data:
