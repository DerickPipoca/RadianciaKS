version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: radiancia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - radiancia_data:/var/lib/postgresql/data

  api:
    image: ghcr.io/derickpipoca/radianciaks-api:latest
    container_name: radiancia_api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - TENANT_ID=${TENANT_ID}
      - TZ=${APP_TIMEZONE:-America/Sao_Paulo}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__ExpiryInMinutes=${JWT_EXPIRATION_HOURS:-12}
      - ADMIN_INITIAL_CPF=${ADMIN_INITIAL_CPF}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}

  frontend:
    image: ghcr.io/derickpipoca/radianciaks-frontend:latest
    container_name: radiancia_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

  watchtower:
    image: containrrr/watchtower
    container_name: radiancia_watchtower
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_RUN_ONCE=true
      - WATCHTOWER_CLEANUP=true
      - TZ=${APP_TIMEZONE:-America/Sao_Paulo}

volumes:
  radiancia_data:
