services:
  db:
    image: postgres:16-alpine
    container_name: radianciaks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - radiancia_data:/var/lib/postgresql/data
    networks:
      - radianciaks_network

  api:
    image: ghcr.io/derickpipoca/radianciaks-api:latest
    container_name: radianciaks_api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - TENANT_ID=${TENANT_ID}
      - TZ=${APP_TIMEZONE:-America/Sao_Paulo}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__ExpiryInMinutes=${JWT_EXPIRATION_MINUTES}
      - JwtSettings__Issuer=RadianciaKS_Api
      - JwtSettings__Audience=RadianciaKS_Angular
      - ADMIN_INITIAL_CPF=${ADMIN_INITIAL_CPF}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
      - CloudflareR2__Endpoint=${CLOUDFLARE_R2_ENDPOINT}
      - CloudflareR2__AccessKeyId=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - CloudflareR2__SecretAccessKey=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - CloudflareR2__BucketName=${CLOUDFLARE_R2_BUCKET_NAME}
    volumes:
      - ./backups:/app/backups
    networks:
      - radianciaks_network

  frontend:
    image: ghcr.io/derickpipoca/radianciaks-frontend:latest
    container_name: radianciaks_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - radianciaks_network

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: radianciaks_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend
      - api
    networks:
      - radianciaks_network

  watchtower:
    image: containrrr/watchtower
    container_name: radianciaks_watchtower
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_RUN_ONCE=true
      - WATCHTOWER_CLEANUP=true
      - REPO_USER=derickpipoca
      - REPO_PASS=${GHCR_TOKEN}
      - TZ=${APP_TIMEZONE:-America/Sao_Paulo}

networks:
  radianciaks_network:
    driver: bridge

volumes:
  radiancia_data:
