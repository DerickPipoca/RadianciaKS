version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: radiancia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: radianciaKS
      POSTGRES_PASSWORD: radiancia!2026!radiancia
      POSTGRES_DB: RadianciaDb
    ports:
      - "5432:5432"
    volumes:
      - radiancia_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radiancia_api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=RadianciaDb;Username=radianciaKS;Password=radiancia!2026!radiancia
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: radiancia_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  radiancia_data:
